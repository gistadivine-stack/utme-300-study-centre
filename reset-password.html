
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b46">
  <title>Reset Password | UTME 300 Study Centre</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #102b46, #1e5b86);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.2);
    }

    h1 {
      color: #102b46;
      text-align: center;
      font-size: 25px;
    }

    p {
      color: #526477;
      text-align: center;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border: 1px solid #ccd5df;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #1e5b86;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
    }

    #resetForm {
      display: none;
    }

    a {
      color: #1e5b86;
      display: block;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Reset Your Password</h1>

    <p id="description">
      Please wait while we verify your recovery link.
    </p>

    <form id="resetForm">
      <input
        id="newPassword"
        type="password"
        placeholder="New password"
        minlength="8"
        required
      >

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        minlength="8"
        required
      >

      <button type="submit">Save New Password</button>
    </form>

    <p id="message" role="status"></p>

    <a href="index.html">Return to Study Centre</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://qlctgxmtypsmdixtwlqj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_edSpm2__M81f1nkWJnuZXA_Xhdv_pi6";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const description = document.getElementById("description");

    let recoveryReady = false;

    client.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        form.style.display = "block";
        description.textContent =
          "Enter your new password below.";
        message.textContent = "";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!recoveryReady) {
        message.textContent =
          "Your recovery link has not been verified.";
        return;
      }

      const first = document.getElementById("newPassword").value;
      const second = document.getElementById("confirmPassword").value;

      if (first.length < 8) {
        message.textContent =
          "Your password must contain at least 8 characters.";
        return;
      }

      if (first !== second) {
        message.textContent = "Your passwords do not match.";
        return;
      }

      message.textContent = "Updating your password...";

      const { error } = await client.auth.updateUser({
        password: first
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      await client.auth.signOut();

      form.style.display = "none";
      description.textContent =
        "Your password has been changed successfully.";

      message.textContent =
        "You can now return to the Study Centre and sign in with your new password.";
    });
  </script>
</body>
</html>
